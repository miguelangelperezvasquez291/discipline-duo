<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Discipline Duo</title>
<meta name="description" content="Disciplina diaria, gimnasio y tenis para dos.">
<meta name="theme-color" content="#08080A" id="theme-color">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Discipline Duo">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png" sizes="180x180">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Space+Mono:wght@700&display=swap">
<style>
  /* ================================================================
     Dos mundos visuales, uno por perfil.
     Miguel -> negro y grafito, industrial.  Sofía -> gris lila y morado.
     Cada paleta se pinta completa: la app sigue el perfil, no el teléfono.
     ================================================================ */
  :root, :root[data-profile="miguel"] {
    --ground:#08080A; --surface:#121215; --surface-2:#1B1B20; --line:#2A2A31;
    --text:#F3F3F5; --muted:#8C8C97; --faint:#5A5A66;
    --accent:#E9E9EC; --accent-soft:rgba(233,233,236,.10); --on-accent:#08080A;
    --reward:#C9CBD2; --good:#9BE8B0; --warn:#E8C87A; --ring-track:#23232A;
    --quote-case:uppercase; --quote-spacing:.01em; --photo-filter:grayscale(1) contrast(1.15);
  }
  :root[data-profile="sofia"] {
    --ground:#F3F0F8; --surface:#FFFFFF; --surface-2:#EFE9F7; --line:#E2D9F0;
    --text:#241B33; --muted:#6C6182; --faint:#9A8FAF;
    --accent:#7A45E0; --accent-soft:rgba(122,69,224,.10); --on-accent:#FFFFFF;
    --reward:#D9599F; --good:#2E9E6B; --warn:#C98A2B; --ring-track:#E4DAF3;
    --quote-case:none; --quote-spacing:0; --photo-filter:none;
  }
  :root {
    --radius:20px; --radius-sm:14px;
    --ff-display:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;
    --ff-body:"DM Sans",system-ui,-apple-system,sans-serif;
    --ff-mono:"Space Mono",ui-monospace,monospace;
    color-scheme: dark light;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { background:#08080A; -webkit-text-size-adjust:100%; }
  body {
    margin:0; background:var(--ground); color:var(--text);
    font-family:var(--ff-body); font-size:16px; line-height:1.45;
    -webkit-font-smoothing:antialiased;
    transition:background .35s ease, color .35s ease;
  }
  img { max-width:100%; display:block; }
  [hidden] { display:none !important; }
  button { font-family:inherit; cursor:pointer; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }

  .shell {
    max-width:480px; margin:0 auto; min-height:100vh; min-height:100dvh;
    background:var(--ground); display:flex; flex-direction:column;
    transition:background .35s ease;
  }
  @media (min-width:520px) {
    body { padding:22px 0; }
    .shell { min-height:calc(100dvh - 44px); border-radius:34px; border:1px solid var(--line); overflow:hidden; }
  }

  /* ---------- Header ---------- */
  header {
    position:sticky; top:0; z-index:20;
    padding:calc(16px + env(safe-area-inset-top)) 18px 12px;
    background:var(--ground); border-bottom:1px solid var(--line);
  }
  .brand-row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .brand { display:flex; align-items:center; gap:10px; min-width:0; }
  .brand .dot { width:11px; height:11px; border-radius:3px; background:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); flex:0 0 auto; }
  .brand h1 { font-family:var(--ff-display); font-weight:800; font-size:19px; letter-spacing:-.02em; margin:0; white-space:nowrap; }
  .date { font-size:13.5px; color:var(--muted); margin-top:2px; white-space:nowrap; }
  .switch { display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:13px; flex:0 0 auto; }
  .switch button {
    border:0; background:transparent; color:var(--muted); font-weight:600; font-size:14px;
    padding:7px 12px; border-radius:10px; transition:all .2s ease; display:flex; align-items:center; gap:6px;
  }
  .switch button .av { width:16px; height:16px; border-radius:50%; flex:0 0 auto; }
  .switch button[data-p="miguel"] .av { background:linear-gradient(140deg,#D7D7DC,#6E6E78); }
  .switch button[data-p="sofia"] .av { background:linear-gradient(140deg,#B98CF5,#E06CAE); }
  .switch button.on { background:var(--surface); color:var(--text); }

  main { flex:1; padding:16px 16px 100px; display:flex; flex-direction:column; gap:14px; }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:17px; }
  .card-title { font-family:var(--ff-display); font-weight:700; font-size:16.5px; letter-spacing:-.01em; margin:0 0 2px; }
  .card-sub { font-size:13.5px; color:var(--muted); margin:0; }
  .eyebrow { font-size:11.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); }
  .disclaimer { font-size:11.5px; color:var(--faint); }

  /* ---------- Frase del día ---------- */
  .quote { display:flex; gap:15px; align-items:center; }
  .photo {
    flex:0 0 74px; width:74px; height:74px; border-radius:19px; overflow:hidden;
    background:var(--surface-2); border:1px solid var(--line); display:grid; place-items:center;
    cursor:pointer; padding:0;
  }
  .photo img { width:100%; height:100%; object-fit:cover; filter:var(--photo-filter); }
  .photo .ph { display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--faint); }
  .photo .ph svg { width:22px; height:22px; }
  .photo .ph span { font-size:9px; font-weight:700; letter-spacing:.07em; }
  .quote-txt { flex:1; min-width:0; }
  .quote-txt .qe { font-size:11px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; color:var(--faint); margin:0 0 6px; }
  .quote-txt .q {
    font-family:var(--ff-display); font-weight:700; font-size:16px; line-height:1.34;
    letter-spacing:var(--quote-spacing); text-transform:var(--quote-case); text-wrap:balance; margin:0;
  }

  /* ---------- Hero ---------- */
  .hero { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; display:flex; align-items:center; gap:16px; }
  .ring { position:relative; flex:0 0 112px; width:112px; height:112px; }
  .ring svg { transform:rotate(-90deg); display:block; }
  .ring .track { stroke:var(--ring-track); }
  .ring .prog { stroke:var(--accent); stroke-linecap:round; transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1); }
  .ring .center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring .pct { font-family:var(--ff-mono); font-size:28px; font-weight:700; letter-spacing:-.03em; line-height:1; }
  .ring .pct span { font-size:13px; color:var(--muted); }
  .ring .cap { font-size:11px; color:var(--muted); letter-spacing:.08em; margin-top:4px; }
  .hero-side { flex:1; min-width:0; display:flex; flex-direction:column; gap:10px; }
  .hero-title { font-family:var(--ff-display); font-weight:800; font-size:17.5px; letter-spacing:-.02em; line-height:1.22; margin:0; text-wrap:balance; }
  .stat-row { display:flex; gap:8px; }
  .stat { flex:1; background:var(--surface-2); border-radius:var(--radius-sm); padding:9px 10px; }
  .stat .n { font-family:var(--ff-mono); font-weight:700; font-size:17.5px; line-height:1.1; color:var(--reward); font-variant-numeric:tabular-nums; }
  .stat .l { font-size:11px; color:var(--muted); }

  /* ---------- Avisos ---------- */
  .nudge { display:flex; gap:11px; align-items:flex-start; background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--warn); border-radius:var(--radius-sm); padding:13px 14px; }
  .nudge .ic { font-size:18px; line-height:1.2; flex:0 0 auto; }
  .nudge p { margin:0; font-size:14px; }

  /* ---------- Hábitos ---------- */
  .habit { display:flex; flex-direction:column; gap:12px; }
  .habit-head { display:flex; align-items:center; gap:12px; }
  .habit-ic { flex:0 0 42px; width:42px; height:42px; border-radius:13px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent); }
  .habit-ic svg { width:22px; height:22px; }
  .habit-meta { flex:1; min-width:0; }
  .habit-name { font-weight:600; font-size:16px; }
  .habit-goal { font-size:13px; color:var(--muted); }
  .habit-val { font-family:var(--ff-mono); font-weight:700; font-size:16.5px; white-space:nowrap; color:var(--muted); font-variant-numeric:tabular-nums; }
  .habit-val.done { color:var(--accent); }

  .stepper { display:flex; align-items:center; gap:9px; }
  .stepper button {
    flex:0 0 auto; width:46px; height:46px; border-radius:13px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--text); font-size:21px; font-weight:600;
    display:grid; place-items:center; transition:transform .1s;
  }
  .stepper button:active { transform:scale(.92); }
  .stepper button.wide { width:auto; padding:0 15px; font-size:15px; font-family:var(--ff-mono); }
  .stepper .fill { flex:1; min-width:0; }
  .bar { height:10px; background:var(--surface-2); border-radius:999px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--accent); border-radius:999px; transition:width .5s cubic-bezier(.4,0,.2,1); }
  .num-in {
    width:100px; text-align:center; font-family:var(--ff-mono); font-weight:700; font-size:17px;
    padding:10px 4px; border-radius:12px; border:1px solid var(--line); background:var(--surface-2); color:var(--text);
  }

  .check { display:flex; align-items:center; gap:13px; width:100%; background:transparent; border:0; padding:0; text-align:left; color:var(--text); }
  .box { flex:0 0 31px; width:31px; height:31px; border-radius:10px; border:2px solid var(--line); display:grid; place-items:center; transition:all .18s ease; color:var(--on-accent); }
  .box svg { width:17px; height:17px; opacity:0; transform:scale(.5); transition:all .18s ease; }
  .check.on .box { background:var(--accent); border-color:var(--accent); }
  .check.on .box svg { opacity:1; transform:scale(1); }

  /* ---------- Rutina corta bajo un hábito ---------- */
  .routine { margin:10px 0 0; padding-top:10px; border-top:1px solid var(--line); font-size:12.5px; color:var(--muted); line-height:1.5; }

  /* ---------- Portugués ---------- */
  .ptask { padding:12px 0 0; margin-top:12px; border-top:1px solid var(--line); align-items:flex-start; }
  .ptask .box { margin-top:1px; }
  .exam { display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-top:14px; padding-top:13px; border-top:1px solid var(--line); font-size:13px; color:var(--muted); }
  .exam input {
    font-family:var(--ff-mono); font-weight:700; font-size:14px; color:var(--text);
    padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:var(--surface-2);
  }

  /* ---------- Cardio ---------- */
  .acts { display:flex; flex-wrap:wrap; gap:7px; }
  .act {
    border:1.5px solid var(--line); background:var(--surface-2); color:var(--text);
    border-radius:999px; padding:9px 14px; font-size:13.5px; font-weight:600; transition:all .15s ease;
  }
  .act.on { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .pickrow { display:flex; align-items:center; gap:9px; background:var(--surface-2); border-radius:var(--radius-sm); padding:11px; }
  .pickrow button.mn {
    flex:0 0 auto; width:44px; height:44px; border-radius:12px; border:1px solid var(--line);
    background:var(--surface); color:var(--text); font-family:var(--ff-mono); font-size:14px; font-weight:700;
  }
  .pickval { flex:1; text-align:center; min-width:0; }
  .pickval .pv { font-family:var(--ff-mono); font-weight:700; font-size:18px; line-height:1.1; }
  .pickval .pk { font-size:11.5px; color:var(--muted); }
  .pickrow .add { flex:0 0 auto; border:0; background:var(--accent); color:var(--on-accent); font-weight:700; font-size:14px; padding:0 16px; height:44px; border-radius:12px; }
  .centry { display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); font-size:14.5px; }
  .centry .cm { color:var(--muted); font-size:13px; }
  .centry .ck { margin-left:auto; font-family:var(--ff-mono); font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums; }
  .centry .cx { background:transparent; border:0; color:var(--faint); font-size:17px; padding:0 2px; line-height:1; }
  .wrow { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:13px; padding-top:13px; border-top:1px solid var(--line); font-size:13px; color:var(--muted); }
  .wrow input {
    width:78px; font-family:var(--ff-mono); font-weight:700; font-size:15px; text-align:center;
    padding:8px 4px; border-radius:10px; border:1px solid var(--line); background:var(--surface-2); color:var(--text);
  }

  /* ---------- Gym ---------- */
  .badge { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:5px 11px; border-radius:999px; background:var(--accent-soft); color:var(--accent); letter-spacing:.03em; }
  .note { display:flex; gap:9px; align-items:flex-start; background:var(--surface-2); border-radius:var(--radius-sm); padding:12px 13px; font-size:13.5px; color:var(--muted); border-left:3px solid var(--warn); }
  .note b { color:var(--text); font-weight:600; }
  .ex { padding:13px 0; border-top:1px solid var(--line); }
  .ex:first-of-type { border-top:0; padding-top:5px; }
  .ex-top { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .ex-name { font-weight:600; font-size:15.5px; }
  .ex-scheme { font-family:var(--ff-mono); font-size:12.5px; color:var(--muted); white-space:nowrap; }
  .ex-tip { font-size:12.5px; color:var(--faint); margin-top:3px; }
  .sets { display:flex; gap:7px; margin-top:10px; flex-wrap:wrap; }
  .set-dot {
    width:40px; height:40px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface-2);
    color:var(--muted); font-family:var(--ff-mono); font-weight:700; font-size:13.5px; display:grid; place-items:center; transition:all .15s ease;
  }
  .set-dot.on { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .ex-done { color:var(--good); }

  /* ---------- Calendario ---------- */
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .cal-dow { text-align:center; font-size:11px; font-weight:700; color:var(--faint); letter-spacing:.04em; padding-bottom:3px; }
  .cal-cell {
    aspect-ratio:1; border-radius:11px; border:1.5px solid transparent; background:var(--surface-2);
    color:var(--muted); font-family:var(--ff-mono); font-size:12.5px; font-weight:700;
    display:grid; place-items:center; transition:all .15s ease; padding:0;
  }
  .cal-cell.void { background:transparent; }
  .cal-cell.on { background:var(--accent); color:var(--on-accent); }
  .cal-cell.today { border-color:var(--reward); }
  .cal-cell.future { opacity:.35; }

  /* ---------- Ciclo ---------- */
  .phases { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .phase { border:1.5px solid var(--line); background:var(--surface-2); border-radius:var(--radius-sm); padding:11px 12px; text-align:left; color:var(--text); display:flex; flex-direction:column; gap:1px; transition:all .15s ease; }
  .phase .pdot { width:9px; height:9px; border-radius:50%; margin-bottom:5px; }
  .phase .pn { font-weight:600; font-size:14.5px; }
  .phase .pd { font-size:11.5px; color:var(--muted); }
  .phase.on { border-color:var(--accent); background:var(--accent-soft); }
  .advice { margin-top:12px; background:var(--accent-soft); border-radius:var(--radius-sm); padding:14px 15px; }
  .advice .tag { display:inline-block; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin-bottom:6px; }
  .advice p { margin:0; font-size:14px; }
  .adjust { display:flex; gap:8px; margin-top:11px; }
  .adjust div { flex:1; background:var(--surface); border-radius:12px; padding:9px; text-align:center; }
  .adjust .k { font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .adjust .v { font-family:var(--ff-mono); font-weight:700; font-size:14px; }

  /* ---------- Tenis ---------- */
  .block { display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--line); }
  .block:first-of-type { border-top:0; }
  .block .min { flex:0 0 52px; font-family:var(--ff-mono); font-weight:700; font-size:14px; color:var(--accent); text-align:right; font-variant-numeric:tabular-nums; }
  .block .bn { font-size:15px; font-weight:500; }
  .field { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
  .field label { font-size:12.5px; font-weight:600; color:var(--muted); }
  .field textarea, .field input[type=date] {
    font-family:inherit; font-size:16px; color:var(--text); background:var(--surface-2);
    border:1px solid var(--line); border-radius:12px; padding:12px 13px; resize:vertical; width:100%;
  }
  .field textarea { min-height:62px; }
  .feel { display:flex; gap:7px; }
  .feel button { flex:1; border:1.5px solid var(--line); background:var(--surface-2); border-radius:12px; padding:10px 0; font-size:19px; transition:all .15s ease; }
  .feel button.on { border-color:var(--accent); background:var(--accent-soft); transform:translateY(-1px); }
  .btn-primary { width:100%; border:0; background:var(--accent); color:var(--on-accent); font-weight:700; font-size:16px; padding:15px; border-radius:15px; transition:transform .1s, opacity .15s; }
  .btn-primary:active { transform:scale(.98); }
  .btn-primary:disabled { opacity:.4; }
  .log { border:1px solid var(--line); border-radius:var(--radius-sm); padding:13px; margin-top:10px; }
  .log-top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .log-date { font-family:var(--ff-mono); font-size:12px; color:var(--muted); }
  .log h4 { margin:9px 0 2px; font-size:11px; color:var(--faint); font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
  .log p { margin:0; font-size:14.5px; }
  .del { background:transparent; border:0; color:var(--faint); font-size:12.5px; padding:5px; }
  .empty { text-align:center; color:var(--muted); font-size:14px; padding:22px 8px; }

  /* ---------- Nav ---------- */
  nav { position:sticky; bottom:0; z-index:20; display:flex; padding:8px 10px calc(8px + env(safe-area-inset-bottom)); background:var(--ground); border-top:1px solid var(--line); }
  nav button { flex:1; border:0; background:transparent; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 0; font-size:11.5px; font-weight:600; transition:color .15s; }
  nav button svg { width:24px; height:24px; }
  nav button.on { color:var(--accent); }
  .sync { display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--faint); justify-content:center; padding:0 0 7px; }
  .sync .d { width:6px; height:6px; border-radius:50%; background:var(--good); }

  #confetti { position:fixed; inset:0; pointer-events:none; z-index:60; }
</style>
</head>
<body>

<div class="shell">
  <header>
    <div class="brand-row">
      <div class="brand">
        <span class="dot"></span>
        <div><h1>Discipline Duo</h1><div class="date" id="date"></div></div>
      </div>
      <div class="switch" id="switch">
        <button data-action="profile" data-p="miguel"><span class="av"></span>Miguel</button>
        <button data-action="profile" data-p="sofia"><span class="av"></span>Sofía</button>
      </div>
    </div>
  </header>
  <main id="main"></main>
  <div class="sync"><span class="d"></span><span id="sync-txt">Se guarda solo en este teléfono</span></div>
  <nav id="nav">
    <button data-action="tab" data-t="hoy" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Hoy
    </button>
    <button data-action="tab" data-t="gym">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 6.5 11 11"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/></svg>Gym

function cardioList(p){ return data[p].cardio[TKEY] || []; }
function cardioKcal(p){ return Math.round(cardioList(p).reduce((s,e)=>s+(e.kcal||0),0)); }
function cardioMin(p){ return cardioList(p).reduce((s,e)=>s+(e.min||0),0); }
function kcalFor(p,met,min){ return Math.round(met*3.5*(data[p].weight||70)/200*min); }
function actName(id){ const a=ACTIVITIES.find(x=>x[0]===id); return a?a[1]:id; }

/* ----- Portugués ----- */
function ptPlan(){ return PT_PLAN[TODAY.getDay()]; }
function ptDone(p,i){ return !!(data[p].pt[TKEY]||{})[i]; }
function ptAllDone(p){ return ptPlan().tasks.every((_,i)=>ptDone(p,i)); }
function daysToExam(p){
  const e=new Date((data[p].exam||PT_EXAM_DEFAULT)+"T12:00:00");
  return Math.max(0, Math.ceil((e-TODAY)/86400000));
}

function isDone(p,h,k){
  if(k==="water")     return (h.water||0)>=WATER_GOAL;
  if(k==="steps")     return (h.steps||0)>=STEP_GOAL;
  if(k==="cardio")    return cardioKcal(p)>=CARDIO_GOAL[p];
  if(k==="portugues") return ptAllDone(p);
  return !!h[k];
}
function doneCount(p,h){ return HABITS[p].filter(k=>isDone(p,h,k)).length; }
function dayFull(p,h){ return !!h && doneCount(p,h)===HABITS[p].length; }
function pointsDay(p,h){ if(!h) return 0; const n=doneCount(p,h); return n*10 + (n===HABITS[p].length?20:0); }
function totalPoints(p){ return Object.values(data[p].habits).reduce((s,h)=>s+pointsDay(p,h),0); }
function streak(p){
  const h=data[p].habits;
  let cur = dayFull(p,h[TKEY]) ? new Date(TODAY) : addDays(TODAY,-1);
  let n=0;
  while(dayFull(p,h[keyOf(cur)])){ n++; cur=addDays(cur,-1); }
  return n;
}
function wentToGym(p,k){
  if(data[p].att[k]) return true;
  return Object.keys(data[p].gym).some(g=>g.startsWith(k+"|"));
}
function gymStreak(p){
  let cur=new Date(TODAY), n=0;
  if(!wentToGym(p,TKEY)) cur=addDays(cur,-1);
  while(wentToGym(p,keyOf(cur))){ n++; cur=addDays(cur,-1); }
  return n;
}
function dayOfYear(d){ return Math.floor((d-new Date(d.getFullYear(),0,0))/86400000); }
function quoteOfDay(p){ const l=QUOTES[p]; return l[dayOfYear(TODAY)%l.length]; }
function tennisSession(){
  const weeks=Math.floor((TODAY-TENNIS_ANCHOR)/(7*86400000));
  return TENNIS[((weeks%TENNIS.length)+TENNIS.length)%TENNIS.length];
}

  const dow=TODAY.getDay(), routine=ROUTINES[p][dow];
  if(dayFull(p,h)) return [{ic:"🏆",t:"Día completo. Todo cumplido — descansa bien, mañana se repite."}];
  if(hr<11 && !isDone(p,h,"movilidad")) out.push({ic:"🌄",t:"Movilidad y estiramiento antes de arrancar el día: 5-10 minutos y listo."});
  if(p==="miguel" && !ptAllDone(p)){
    const plan=ptPlan(), falta=plan.tasks.filter((_,i)=>!ptDone(p,i)).length;
    if(hr>=18) out.push({ic:"💬",t:`Portugués: te faltan ${falta} de ${plan.tasks.length} tareas. Hoy toca ${plan.focus.toLowerCase()}.`});
    else if(plan.clase && hr>=15) out.push({ic:"💬",t:"Repasa hoy mismo los apuntes de la clase. Es lo que más rinde de todo el día."});
  }
  if(hr>=20 && !isDone(p,h,"read")) out.push({ic:"📖",t:"Se está haciendo tarde para leer. Con 10 minutos ya cuenta."});
  if(hr>=17 && !isDone(p,h,"cardio")){
    const falta=CARDIO_GOAL[p]-cardioKcal(p);
    const cam=Math.ceil(falta/Math.max(1,kcalFor(p,5.0,1)));
    const tro=Math.ceil(falta/Math.max(1,kcalFor(p,8.0,1)));
    out.push({ic:"🏃",t:`Te faltan ${falta} kcal de cardio: unos ${cam} min de caminata rápida o ${tro} de trote.`});
  }
  if(hr>=20 && !isDone(p,h,"water")) out.push({ic:"💧",t:`Te falta agua: ${(WATER_GOAL-(h.water||0)).toFixed(2).replace(/\.?0+$/,"")} L para la meta.`});
  if(p==="miguel" && hr>=12 && !h.creatina) out.push({ic:"⚡",t:"No olvides la creatina de hoy."});
  if(p==="miguel" && hr>=19 && !h.proteina) out.push({ic:"🥩",t:"Revisa si cerraste tus gramos de proteína."});
  if(!routine.rest && hr>=16 && !wentToGym(p,TKEY)) out.push({ic:"🏋️",t:`Todavía no registras el entreno: hoy toca ${routine.title}.`});
  if(routine.rest && dow===3 && hr>=16 && !isDone(p,h,"cardio")) out.push({ic:"🚴",t:"Hoy es descanso activo: buen día para cardio suave o una caminata larga."});
  if(hr<10 && !out.length) out.push({ic:"🌅",t:"Arranca el día. El primer hábito es el que empuja a los demás."});
  if(hr>=22 && !isDone(p,h,"sleep")) out.push({ic:"🌙",t:"Hora de cerrar el día. Apunta a 7-8 horas."});
  return out.slice(0,2);
}

/* ---------------- Render ---------------- */
function el(h){ const t=document.createElement("template"); t.innerHTML=h.trim(); return t.content.firstElementChild; }
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

function render(){
  document.documentElement.setAttribute("data-profile",ui.profile);
  document.getElementById("theme-color").setAttribute("content", ui.profile==="miguel" ? "#08080A" : "#F3F0F8");
  document.querySelectorAll("#switch button").forEach(b=>b.classList.toggle("on",b.dataset.p===ui.profile));
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===ui.tab));
  document.getElementById("date").textContent = cap(TODAY.toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"short"}));
  const m=document.getElementById("main");
  m.innerHTML="";
  if(ui.tab==="hoy") renderHoy(m);
  else if(ui.tab==="gym") renderGym(m);
  else renderTenis(m);
}

function calendarHTML(p){
  const y=TODAY.getFullYear(), mo=TODAY.getMonth();
  const first=new Date(y,mo,1), days=new Date(y,mo+1,0).getDate();
  const lead=(first.getDay()+6)%7;
  let cells="";
  for(let i=0;i<lead;i++) cells+=`<div class="cal-cell void"></div>`;
  let month=0;
  for(let d=1;d<=days;d++){
    const k=keyOf(new Date(y,mo,d)), on=wentToGym(p,k);
    if(on) month++;
    const isToday=k===TKEY, future=new Date(y,mo,d)>TODAY;
    cells+=`<button class="cal-cell ${on?"on":""} ${isToday?"today":""} ${future?"future":""}" data-action="att" data-k="${k}">${d}</button>`;
  }
  const allDays=new Set(Object.keys(data[p].gym).map(g=>g.split("|")[0]));
  Object.keys(data[p].att).forEach(k=>{ if(data[p].att[k]) allDays.add(k); });
  return `<div class="card">
    <p class="card-title">Días en el gym</p>
    <p class="card-sub" style="margin-bottom:12px">${cap(TODAY.toLocaleDateString("es-ES",{month:"long"}))}: <b>${month}</b> días · Racha: <b>${gymStreak(p)}</b> 🔥</p>
    <div class="cal-grid">
      ${["L","M","X","J","V","S","D"].map(d=>`<div class="cal-dow">${d}</div>`).join("")}
      ${cells}
    </div>
    <p class="disclaimer" style="margin-top:11px">Se marca solo cuando registras series. Toca un día para marcarlo o quitarlo a mano. Total acumulado: <b>${allDays.size}</b> días.</p>
  </div>`;
}

/* ---------------- Interacción ---------------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-action]"); if(!t) return;
  const a=t.dataset.action, p=ui.profile;

  if(a==="profile"){ ui.profile=t.dataset.p; LS.write("dd_profile",ui.profile); render(); return; }
  if(a==="tab"){ ui.tab=t.dataset.t; LS.write("dd_tab",ui.tab); render(); window.scrollTo(0,0); return; }
  if(a==="photo"){ document.getElementById("photo-in").click(); return; }

  if(a==="water"){ const h=todayHabit(p); h.water=Math.max(0,Math.round((h.water+parseFloat(t.dataset.v))*100)/100); saveProfile(p); after(p); render(); return; }
  if(a==="toggle"){ const h=todayHabit(p); h[t.dataset.h]=!h[t.dataset.h]; saveProfile(p); after(p); render(); return; }
  if(a==="cpick"){ ui.cardioPick = (ui.cardioPick===t.dataset.id) ? null : t.dataset.id; render(); return; }
  if(a==="cmin"){ ui.cardioMin = Math.max(5, ui.cardioMin + parseInt(t.dataset.v,10)); render(); return; }
  if(a==="cadd"){
    const id=ui.cardioPick; if(!id) return;
    let entry;
    if(id==="otro"){
      const k=Math.max(0, parseInt(ui.cardioKcal,10)||0);
      if(!k) return;
      entry={id:Date.now().toString(36), act:"otro", min:0, kcal:k};
    } else {
      const met=ACTIVITIES.find(x=>x[0]===id)[2];
      entry={id:Date.now().toString(36), act:id, min:ui.cardioMin, kcal:kcalFor(p,met,ui.cardioMin)};
    }
    if(!data[p].cardio[TKEY]) data[p].cardio[TKEY]=[];
    data[p].cardio[TKEY].push(entry);
    ui.cardioPick=null;
    saveProfile(p); after(p); render(); return;
  }
  if(a==="cdel"){
    const l=data[p].cardio[TKEY]||[];
    data[p].cardio[TKEY]=l.filter(x=>x.id!==t.dataset.id);
    saveProfile(p); after(p); render(); return;
  }
  if(a==="pt"){
    const i=t.dataset.i;
    if(!data[p].pt[TKEY]) data[p].pt[TKEY]={};
    const m=data[p].pt[TKEY];
    if(m[i]) delete m[i]; else m[i]=true;
    saveProfile(p); after(p); render(); return;
  }

  if(a==="set"){ const g=data[p].gym,k=t.dataset.key; if(g[k]) delete g[k]; else g[k]=true; saveProfile(p); render(); return; }
  if(a==="att"){
    const k=t.dataset.k;
    if(wentToGym(p,k)){ data[p].att[k]=false; Object.keys(data[p].gym).forEach(g=>{ if(g.startsWith(k+"|")) delete data[p].gym[g]; }); }
    else data[p].att[k]=true;
    saveProfile(p); render(); return;
  }
  if(a==="phase"){ data.sofia.cycle[TKEY]=t.dataset.name; saveProfile("sofia"); render(); return; }
  if(a==="feel"){ ui.tennisDraft.feel=parseInt(t.dataset.v,10); render(); return; }

  if(a==="tennis-save"){
    const d=ui.tennisDraft;
    if(!d.practiced&&!d.improve) return;
    data.tennis.push({id:Date.now().toString(36),date:d.date,practiced:d.practiced,improve:d.improve,feel:d.feel||3});
    saveTennis(); ui.tennisDraft={}; render(); return;
  }
  if(a==="tennis-del"){ data.tennis=data.tennis.filter(x=>x.id!==t.dataset.id); saveTennis(); render(); return; }
});

document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="steps-in"){ const h=todayHabit(ui.profile); h.steps=Math.max(0,parseInt(e.target.value||"0",10)); saveProfile(ui.profile); }
  if(id==="weight-in"){ const w=parseInt(e.target.value||"0",10); if(w>=30&&w<=200){ data[ui.profile].weight=w; saveProfile(ui.profile); } }
  if(id==="ckcal-in"){ ui.cardioKcal=Math.max(0,parseInt(e.target.value||"0",10)); }
  if(id==="exam-in" && e.target.value){ data[ui.profile].exam=e.target.value; saveProfile(ui.profile); render(); }
  if(id==="t-date") ui.tennisDraft.date=e.target.value;
  if(id==="t-practiced") ui.tennisDraft.practiced=e.target.value;
  if(id==="t-improve") ui.tennisDraft.improve=e.target.value;
});
document.addEventListener("change",e=>{
  if(e.target.id==="steps-in" || e.target.id==="weight-in"){ after(ui.profile); render(); }
  if(e.target.id==="photo-in"){
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const S=280, c=document.createElement("canvas"); c.width=S; c.height=S;
        const ctx=c.getContext("2d");
        const side=Math.min(img.width,img.height);
        ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,S,S);
        photos[ui.profile]=c.toDataURL("image/jpeg",0.82);
        LS.write("dd_photo_"+ui.profile,photos[ui.profile]);
        render();
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(f);
    e.target.value="";
  }
});

/* ---------------- Celebración ---------------- */
function after(p){
  const h=todayHabit(p), key=p+TKEY;
  if(dayFull(p,h)&&!ui.celebrated[key]){ ui.celebrated[key]=true; confetti(); }
  if(!dayFull(p,h)) ui.celebrated[key]=false;
}
function confetti(){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=document.getElementById("confetti"), ctx=cv.getContext("2d");
  cv.width=innerWidth; cv.height=innerHeight;
  const cols = ui.profile==="miguel"
    ? ["#FFFFFF","#C9CBD2","#8C8C97","#E9E9EC"]
    : ["#7A45E0","#D9599F","#B98CF5","#F0C2E0"];
  const parts=[];
  for(let i=0;i<90;i++) parts.push({x:innerWidth/2+(Math.random()-.5)*130,y:innerHeight*.32,
    vx:(Math.random()-.5)*9,vy:Math.random()*-11-4,g:.35+Math.random()*.2,
    s:5+Math.random()*6,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4});
  let f=0;
  (function loop(){
    ctx.clearRect(0,0,cv.width,cv.height); f++;
    parts.forEach(o=>{ o.vy+=o.g; o.x+=o.vx; o.y+=o.vy; o.r+=o.vr;
      ctx.save(); ctx.translate(o.x,o.y); ctx.rotate(o.r); ctx.fillStyle=o.c;
      ctx.fillRect(-o.s/2,-o.s/2,o.s,o.s*.6); ctx.restore(); });
    if(f<95) requestAnimationFrame(loop); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

/* ---------------- Arranque ---------------- */
loadLocal();
render();
setInterval(()=>{
  const n=new Date();
  if(ui.tab==="hoy" && NOW.getHours()!==n.getHours()){ NOW=n; render(); }
},60000);
</script>
